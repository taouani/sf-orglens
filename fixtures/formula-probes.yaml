  - { covers: "/", formula: "Amount__c / 2", names: [Amount__c] }
  - { covers: "^", formula: "Amount__c ^ 2", names: [Amount__c] }
  - { covers: "()", formula: "(Amount__c + 1) * (2 - Tax_Rate__c)", names: [Amount__c, Tax_Rate__c] }
  - { covers: "unary -", formula: "-Amount__c + -(1)", names: [Amount__c] }
  - { covers: "unary +", formula: "+Amount__c", names: [Amount__c] }
  - { covers: "=", formula: "Amount__c = 0", names: [Amount__c] }
  - { covers: "==", formula: "Amount__c == 0", names: [Amount__c] }
  - { covers: "<>", formula: "Amount__c <> 0", names: [Amount__c] }
  - { covers: "!=", formula: "Amount__c != 0", names: [Amount__c] }
  - { covers: "<", formula: "Amount__c < 10", names: [Amount__c] }
  - { covers: ">", formula: "Amount__c > 10", names: [Amount__c] }
  - { covers: "<=", formula: "Amount__c <= 10", names: [Amount__c] }
  - { covers: ">=", formula: "Amount__c >= 10", names: [Amount__c] }
  - { covers: "&&", formula: "Amount__c > 0 && Tax_Rate__c > 0", names: [Amount__c, Tax_Rate__c] }
  - { covers: "||", formula: "Amount__c > 0 || Tax_Rate__c > 0", names: [Amount__c, Tax_Rate__c] }
  - { covers: "!", formula: "!(Amount__c > 0)", names: [Amount__c] }
  - { covers: "NOT as an operator", formula: "NOT Is_Mine__c", names: [Is_Mine__c], note: "The grammar reads NOT before a name without brackets." }
  - { covers: "&", formula: "Legacy_Code__c & External_Id__c", names: [Legacy_Code__c, External_Id__c] }
  - { covers: "+ on text", formula: "Legacy_Code__c + '-' + External_Id__c", names: [Legacy_Code__c, External_Id__c] }
  - { covers: "no spaces", formula: "Amount__c*2+Tax_Rate__c/4-1", names: [Amount__c, Tax_Rate__c] }
