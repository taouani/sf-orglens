# Formula probes: one small formula for every operator, every kind of literal, every kind of name and every
# function of the formula language of Salesforce. An analyser must read each of them without a problem.
#
# What is not probed: a text that runs over two lines, which the grammar of the engine refuses and the formula
# editor of Salesforce may accept, and the named arguments in square brackets of old buttons.
#
# The probes test the reading of a formula, not what it means. They are not deployed, so Salesforce has not
# checked them: the kinds of the arguments are plausible and not verified. Each formula is written for the object
# Invoice__c of the project billing-sfdx, and names only fields that project has. ../README.md says more.
#
# One probe: { covers, formula, names } and, where it applies: seen, where, note.
#   covers   the operator, literal, kind of name or function the probe is there for. No two probes cover the same.
#   formula  the formula, as the text of the element, with no entities of XML.
#   names    every name of the formula that is not the name of a call and not TRUE, FALSE, NULL or NOT, in the
#            order they stand, each as it is written with its dots. A name in a comment or in a text is not one.
#   seen     for a function: where the name was seen. See `sources`.
#   where    `elsewhere` for a function that Salesforce offers in a report, a button, a page or an action, and not
#            in a formula field or a validation rule. Phase 1 reads no formula of that kind. The call is read anyway.
#            The mark is written from the summary of the help page and is not verified.

version: 1
object: Invoice__c

sources:
  # The help page "Formula Operators and Functions by Context" of Salesforce, fetched on 15 November 2026. It names
  # no release. The fetch gave the first two thirds of the page as it is written, and a summary of the rest.
  help: The name stands in the part of the help page that was fetched as written.
  help-summary: The name stands only in the summary of the rest of the page. It was not read as written.
  # github.com/salesforce/formula-engine at commit 118bbca82d0791eab43c413aff4f243d0f0af59e. Its grammar is the
  # source of the operators, the literals and the characters of a name below.
  engine: The name stands in the code of the open-source formula engine of Salesforce, implemented or only named.

probes:
