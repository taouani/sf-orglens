# It was written by hand, by reading the files, before any analyser existed. It
# says which references an analyser must find in the project, and which it must
# never report. The format and the rules of what is keyed are in ../README.md.
# packages/engine/test/fixture-key.test.ts checks this file against the project.
#
# One entry: { line, match, kind, to, via } and, where they differ from the
# default: nth (1), tier (confirmed), op, stretch (false), note.
#   line, match, nth   where the reference stands: the nth whole word `match` on that line
#   kind               reads | writes | references | extends | triggers-on
#   to                 the component key of the target
#   via                how the source names the target (see README)
#   stretch            an analyser may miss it without losing recall, and may find it without losing precision

