# The answer key of the fixture project billing-sfdx, version 3.
#
# Version 3 is version 2 with what Phase 3 reads. Of the Apex that was there it adds the kinds that version 2 did not
# key: calls, uses as a type, interfaces, the reads and writes of the members of classes, the object in front of a
# field token, and the named credential of a callout. And it keys the 27 components that work package 1 of Phase 3
# added: 15 Apex classes and a trigger, two Lightning web components, an Aura component, two Visualforce pages, a
# named credential and the external credential it signs in with, a platform event with its field, a record of the
# custom metadata type, and a flow that hands its record to a generic Apex action. Everything of version 2 is here,
# entry for entry, and no entry of version 2 has changed.
#
# Where version 3 says more about a line of version 2, it does so with entries of its own: the same word with another
# target, such as the constant a text comes from, or another word of the line, such as a type or the object in front
# of a field token. One entry of that kind stands in a file of flows and belongs to Phase 3 (phase: 3 on the entry):
#
#   flows/Invoice_Review_Screen.flow-meta.xml, line 8: the Apex action calls the invocable method
#   ApexClass:invoicepaidaction#method:markpaid(list<id>), beside the class, which version 2 names.
#
# It was written by hand, by reading the files, before any analyser of Apex, of a Lightning component, of an Aura
# component or of a page existed in the engine. The Apex trial of Phase 0 reads Apex, and was not run on it.
# It says which references an analyser must find in the project, and which it must
# never report. The format and the rules of what is keyed are in ../README.md.
# packages/engine/test/fixture-key.test.ts checks this file against the project.
#
# One entry: { line, match, kind, to, via } and, where they differ from the
# default: nth (1), tier (confirmed), op, stretch (false), phase (that of the file), note.
#   line, match, nth   where the reference stands: the nth whole word `match` on that line
#   kind               reads | writes | references | extends | implements | uses-type | triggers-on | calls
#   to                 the component key of the target
#   via                how the source names the target (see README)
#   op                 what a DML statement or a record element of a flow does to the object
#   stretch            an analyser may miss it without losing recall, and may find it without losing precision
#   phase              the phase whose analyser must find this entry, where it is not the phase of its file

