# The answer key of the fixture project billing-sfdx, version 2.
#
# Version 2 is version 1 with what Phase 2 added to the project: six flows, the workflow rules of two objects,
# two record types, a field set, three fields and three records of the custom metadata type, a validation rule,
# an email template and an Apex class that a flow calls. Everything of version 1 is here, entry for entry.
#
# It was written by hand, by reading the files, before any analyser of these types existed. It
# says which references an analyser must find in the project, and which it must
# never report. The format and the rules of what is keyed are in ../README.md.
# packages/engine/test/fixture-key.test.ts checks this file against the project.
#
# One entry: { line, match, kind, to, via } and, where they differ from the
# default: nth (1), tier (confirmed), op, stretch (false), note.
#   line, match, nth   where the reference stands: the nth whole word `match` on that line
#   kind               reads | writes | references | extends | triggers-on | calls
#   to                 the component key of the target
#   via                how the source names the target (see README)
#   op                 what a DML statement or a record element of a flow does to the object
#   stretch            an analyser may miss it without losing recall, and may find it without losing precision

version: 2
project: billing-sfdx

