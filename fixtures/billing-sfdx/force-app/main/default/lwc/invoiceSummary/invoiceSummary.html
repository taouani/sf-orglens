<template>
    <lightning-card title={notice}>
        <p>{amount} {tier}</p>
        <lightning-record-view-form record-id={invoiceId} object-api-name="Invoice__c">
            <lightning-output-field field-name="Due_Date__c"></lightning-output-field>
            <lightning-output-field field-name="Status__c"></lightning-output-field>
        </lightning-record-view-form>
        <template lwc:if={invoices.data}>
            <template for:each={invoices.data} for:item="row">
                <c-invoice-badge key={row.Id} status={row.Status__c}></c-invoice-badge>
            </template>
        </template>
        <template lwc:if={showPay}>
            <lightning-button label="Pay" onclick={handlePay}></lightning-button>
        </template>
    </lightning-card>
</template>
