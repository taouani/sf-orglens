name: Release (dry run)

# Rehearses a release. Nothing is published: there is no registry token in
# this repository, and every publish step runs with --dry-run. The real
# release workflow is written when the first release is planned.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Full check
        run: pnpm run check
      - name: Lint the packages as published
        run: pnpm run publint
      - name: Pack, install into an empty folder, run the binary
        run: pnpm run smoke:pack
      - name: Publish (dry run)
        run: pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks --access public
