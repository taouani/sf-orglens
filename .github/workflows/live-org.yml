name: Live org

# The one workflow that reaches a real Salesforce org: the test org of the
# project, a Developer Edition org that holds nothing but the fixture project.
# docs/live-org-setup.md says how the org and its secrets are set up.
#
# It runs when a maintainer starts it, and once a week by itself. The weekly
# run logs in and does nothing else: an org that nobody logs in to can be
# deactivated by Salesforce, and a key that stopped working is noticed within
# a week.
#
# A run that a maintainer starts can do more, by the choice "steps":
#
#   deploy  puts the fixture project (fixtures/billing-sfdx) into the test
#           org. Nothing else is ever deployed, and no Apex test is run.
#   read    takes a snapshot of the test org with the engine, in a folder
#           that is deleted when the step ends, and prints what it holds in
#           numbers.
#   probe   asks the org what Salesforce itself knows about references: the
#           rows of the Dependency API and the symbol tables of the Apex
#           compiler, both through the Tooling API. It writes nothing, and
#           prints how much of the answer key of the fixture project each
#           of the two reports.
#
# The secrets belong to the environment "live-org", which hands them only to
# a run from the branch "main". The log of this workflow can be read by
# everyone. A step prints sentences of its own with numbers, codes, names
# of metadata types and of their elements, and names and paths of the
# fixture project. It prints no name of another component of the org, and
# no message that orglens, a Salesforce library or Salesforce wrote, unless
# the whole text has a form the step lists
# (packages/engine/test/live/public-log.ts). Of a message in another form,
# a step shows only the words of a short list of everyday words. The tools
# do their work in a process without output, which can only send such lines
# to the step (own-output.ts). The files of the org are not kept and not
# uploaded.
#
# The steps before the login install and build with the development
# dependencies of the repository. What they build and install is what the
# steps with the secrets run, so those dependencies are trusted with them.
# They are pinned in the lockfile. pnpm runs the install script of a
# dependency only if the repository allows it, and this one allows none.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: What the run does after it has logged in
        type: choice
        default: login only
        options:
          - login only
          - read
          - deploy
          - deploy and read
          - probe
          - read and probe
  schedule:
    # Mondays at 05:17 UTC.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: live-org
  cancel-in-progress: false

jobs:
  login:
    name: Log in to the test org
    # A copy of this repository has no test org. There the job is skipped. If the repository is renamed or
    # moved, this name has to follow: a skipped weekly run logs in to nothing.
    if: github.repository == 'taouani/sf-orglens'
    runs-on: ubuntu-latest
    # A snapshot of an org takes its time. Each step has a limit of its own.
    timeout-minutes: 150
    environment: live-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        # No cache: this job holds the secrets, and a weekly run gains little from one.
        with:
          node-version-file: .node-version
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      # Only the steps from here on get the secrets. The test org is the source "test-org", which gives the
      # variables their names.
      - name: Log in
        timeout-minutes: 10
        env:
          ORGLENS_JWT_TEST_ORG_LOGIN_URL: ${{ secrets.ORGLENS_TEST_ORG_LOGIN_URL }}
          ORGLENS_JWT_TEST_ORG_USERNAME: ${{ secrets.ORGLENS_TEST_ORG_USERNAME }}
          ORGLENS_JWT_TEST_ORG_CLIENT_ID: ${{ secrets.ORGLENS_TEST_ORG_CLIENT_ID }}
          ORGLENS_JWT_TEST_ORG_KEY: ${{ secrets.ORGLENS_TEST_ORG_JWT_KEY }}
          # The Salesforce library keeps its own encryption key in a file, not in a keychain that a runner may lack.
          SF_USE_GENERIC_UNIX_KEYCHAIN: 'true'
        run: node scripts/live-org-login.mjs
      # The steps below are tools of the tests of the engine. Node.js runs them from source.
      - name: Deploy the fixture project
        if: github.event_name == 'workflow_dispatch' && contains(inputs.steps, 'deploy')
        timeout-minutes: 30
        env:
          ORGLENS_JWT_TEST_ORG_LOGIN_URL: ${{ secrets.ORGLENS_TEST_ORG_LOGIN_URL }}
          ORGLENS_JWT_TEST_ORG_USERNAME: ${{ secrets.ORGLENS_TEST_ORG_USERNAME }}
          ORGLENS_JWT_TEST_ORG_CLIENT_ID: ${{ secrets.ORGLENS_TEST_ORG_CLIENT_ID }}
          ORGLENS_JWT_TEST_ORG_KEY: ${{ secrets.ORGLENS_TEST_ORG_JWT_KEY }}
          SF_USE_GENERIC_UNIX_KEYCHAIN: 'true'
        run: node --no-warnings packages/engine/test/live/deploy-fixture.ts
      # After a deploy that failed, the org is not read.
      - name: Read the org
        if: github.event_name == 'workflow_dispatch' && contains(inputs.steps, 'read')
        timeout-minutes: 75
        env:
          ORGLENS_JWT_TEST_ORG_LOGIN_URL: ${{ secrets.ORGLENS_TEST_ORG_LOGIN_URL }}
          ORGLENS_JWT_TEST_ORG_USERNAME: ${{ secrets.ORGLENS_TEST_ORG_USERNAME }}
          ORGLENS_JWT_TEST_ORG_CLIENT_ID: ${{ secrets.ORGLENS_TEST_ORG_CLIENT_ID }}
          ORGLENS_JWT_TEST_ORG_KEY: ${{ secrets.ORGLENS_TEST_ORG_JWT_KEY }}
          SF_USE_GENERIC_UNIX_KEYCHAIN: 'true'
        run: node --no-warnings packages/engine/test/live/read-org.ts
      - name: Ask Salesforce about references
        if: github.event_name == 'workflow_dispatch' && contains(inputs.steps, 'probe')
        timeout-minutes: 30
        env:
          ORGLENS_JWT_TEST_ORG_LOGIN_URL: ${{ secrets.ORGLENS_TEST_ORG_LOGIN_URL }}
          ORGLENS_JWT_TEST_ORG_USERNAME: ${{ secrets.ORGLENS_TEST_ORG_USERNAME }}
          ORGLENS_JWT_TEST_ORG_CLIENT_ID: ${{ secrets.ORGLENS_TEST_ORG_CLIENT_ID }}
          ORGLENS_JWT_TEST_ORG_KEY: ${{ secrets.ORGLENS_TEST_ORG_JWT_KEY }}
          SF_USE_GENERIC_UNIX_KEYCHAIN: 'true'
        run: node --no-warnings packages/engine/test/live/probe-org.ts
