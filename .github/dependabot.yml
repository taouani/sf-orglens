version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days after a release before proposing it, as a guard against
    # compromised packages. pnpm enforces its own minimum release age as well.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # The Node.js types follow the oldest supported Node.js line, so a new major is taken by hand, with the floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The engine reads a `.forceignore` with the very copy of `ignore` that the Salesforce library uses (decision
      # record 0030, held by a test in `sources-forceignore.test.ts`). The library asks for `^5.3.2`. A newer major
      # would be a second copy, and 7.0.14 answers differently from 5.3.2 for some rules with a backslash and for a
      # rule that ends with a tab. So a new major is taken with the library, not before.
      - dependency-name: 'ignore'
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
