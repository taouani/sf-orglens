version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait a few days after a release before proposing it, as a guard against
    # compromised packages. pnpm enforces its own minimum release age as well.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # The Node.js types follow the oldest supported Node.js line, so a new major is taken by hand, with the floor.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ['*']
