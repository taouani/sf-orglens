name: Feature request
description: Suggest something OrgLens should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        OrgLens is built phase by phase against a fixed plan (see `docs/plans/`). Requests are welcome and are
        recorded, but work outside the current phase waits until the impact core has passed its correctness gate.
  - type: textarea
    id: problem
    attributes:
      label: The question you need answered
      description: Describe the situation on a Salesforce project where OrgLens would help, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like OrgLens to do
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you handle it today
    validations:
      required: false
